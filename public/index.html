<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="X Reader" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>X Reader</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      background: #0f172a; color: #e2e8f0;
      min-height: 100vh;
      padding-top: env(safe-area-inset-top);
      overflow-x: hidden;
    }
    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      padding: 12px 14px 10px;
      padding-top: calc(12px + env(safe-area-inset-top));
    }
    h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
    .subtitle { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    .status-bar { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: 999px;
      background: rgba(59, 130, 246, 0.15); color: #93c5fd;
      font-size: 11px; font-weight: 500;
    }
    .toolbar {
      display: flex; gap: 6px; margin-top: 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .toolbar::-webkit-scrollbar { display: none; }

    /* 筛选栏：博主 chips */
    .filter-bar {
      display: flex; gap: 6px; margin-top: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(51, 65, 85, 0.5);
      color: #cbd5e1;
      font-size: 12px; font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
      white-space: nowrap;
      user-select: none;
      -webkit-user-select: none;
    }
    .chip:active { transform: scale(0.95); }
    .chip.active {
      background: rgba(59, 130, 246, 0.9);
      color: white;
      border-color: rgba(147, 197, 253, 0.4);
    }

    button {
      -webkit-appearance: none; appearance: none;
      border: none; outline: none;
      font: inherit; cursor: pointer;
      padding: 10px 14px; border-radius: 10px;
      background: rgba(59, 130, 246, 0.9); color: white;
      font-weight: 600; font-size: 14px;
      transition: opacity 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
      min-height: 40px;
    }
    button:active { opacity: 0.6; transform: scale(0.97); }
    button.secondary { background: rgba(71, 85, 105, 0.6); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    main { padding: 10px 12px 240px; }
    .empty {
      text-align: center; padding: 60px 24px; color: #64748b;
    }
    .empty-emoji { font-size: 48px; margin-bottom: 12px; }

    .tweet {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      transition: background 0.15s, border 0.15s;
    }
    .tweet.playing {
      background: rgba(59, 130, 246, 0.15);
      border-color: rgba(59, 130, 246, 0.4);
    }
    .tweet.listened { opacity: 0.4; }
    .tweet-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 6px; gap: 8px;
    }
    .author { font-size: 13px; font-weight: 600; color: #93c5fd; overflow: hidden; text-overflow: ellipsis; }
    .time { font-size: 11px; color: #64748b; flex-shrink: 0; }
    .content { font-size: 15px; line-height: 1.6; color: #e2e8f0; word-wrap: break-word; overflow-wrap: break-word; }
    .tweet-actions {
      display: flex; gap: 6px; margin-top: 10px;
    }
    .tweet-actions button {
      padding: 8px 12px; font-size: 13px; min-height: 36px;
      background: rgba(51, 65, 85, 0.5);
    }
    .tweet-actions button.play-btn { background: rgba(59, 130, 246, 0.7); }

    /* 底部播放条 */
    .player {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(148, 163, 184, 0.15);
      padding: 12px 16px calc(10px + env(safe-area-inset-bottom));
      transform: translateY(120%);
      transition: transform 0.3s ease;
      z-index: 20;
    }
    .player.active { transform: translateY(0); }
    .player-info {
      font-size: 12px; color: #94a3b8; margin-bottom: 4px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .player-content {
      font-size: 14px; color: #e2e8f0; margin-bottom: 10px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.4;
    }
    .player-controls {
      display: flex; align-items: center; justify-content: center; gap: 16px;
      margin-bottom: 4px;
    }
    .player-btn {
      background: transparent; padding: 8px; min-height: 44px;
      font-size: 22px; color: #e2e8f0;
    }
    .player-btn.main {
      background: white; color: #0f172a;
      width: 52px; height: 52px; border-radius: 999px;
      font-size: 20px; font-weight: 700; padding: 0;
    }

    /* 播放进度条 */
    .progress-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 8px;
      font-size: 11px; color: #64748b;
    }
    .progress-time {
      min-width: 34px; font-variant-numeric: tabular-nums;
    }
    .progress-track {
      flex: 1; height: 4px;
      background: rgba(148, 163, 184, 0.2);
      border-radius: 999px;
      position: relative;
      cursor: pointer;
      touch-action: none;
    }
    .progress-fill {
      position: absolute; left: 0; top: 0; bottom: 0;
      background: #3b82f6;
      border-radius: 999px;
      width: 0%;
      transition: width 0.15s linear;
      pointer-events: none;
    }
    .progress-thumb {
      position: absolute; top: 50%;
      width: 12px; height: 12px;
      background: white;
      border-radius: 999px;
      transform: translate(-50%, -50%);
      left: 0%;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      pointer-events: none;
      transition: left 0.15s linear;
    }

    /* 倍速切换按钮（点击循环切换档位） */
    .speed-toggle {
      background: rgba(51, 65, 85, 0.6) !important;
      color: #cbd5e1 !important;
      width: auto !important;
      height: 40px !important;
      min-width: 52px;
      padding: 0 12px !important;
      border-radius: 999px !important;
      font-size: 14px !important;
      font-weight: 600 !important;
      font-variant-numeric: tabular-nums;
    }
    .speed-toggle:active {
      background: rgba(59, 130, 246, 0.6) !important;
      transform: scale(0.92);
    }

    /* 加载中状态 */
    .loading-dot {
      display: inline-block;
      width: 8px; height: 8px; border-radius: 999px;
      background: #3b82f6;
      margin-right: 6px;
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .toast {
      position: fixed; bottom: 220px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.2);
      padding: 10px 18px; border-radius: 999px;
      font-size: 13px; z-index: 30;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
      max-width: calc(100vw - 40px);
    }
    .toast.show { opacity: 1; }

    /* 大屏（桌面）居中 */
    @media (min-width: 720px) {
      header, main, .player {
        max-width: 640px;
        margin-left: auto; margin-right: auto;
      }
      .player { left: 50%; right: auto; transform: translateX(-50%) translateY(120%); width: 640px; }
      .player.active { transform: translateX(-50%) translateY(0); }
    }
  </style>
</head>
<body>
  <header>
    <h1>X Reader</h1>
    <div class="subtitle" id="subtitle">通勤听推文 · 中英混读</div>
    <div class="status-bar">
      <span class="badge" id="count-badge">加载中…</span>
      <span class="badge" id="sub-badge"></span>
    </div>
    <div class="toolbar">
      <button id="play-all">▶ 全部播放</button>
      <button class="secondary" id="refresh">↻ 刷新</button>
      <button class="secondary" id="toggle-all">显示全部</button>
      <button class="secondary" id="toggle-order" title="切换顺序">🕒 最新在前</button>
    </div>
    <div class="filter-bar" id="filter-bar">
      <!-- 博主 chips 会动态插入 -->
    </div>
  </header>

  <main id="list">
    <div class="empty">
      <div class="empty-emoji">⏳</div>
      <div>加载中…</div>
    </div>
  </main>

  <div class="player" id="player">
    <div class="player-info" id="player-info">--</div>
    <div class="player-content" id="player-content">--</div>
    <div class="progress-row">
      <span class="progress-time" id="progress-cur">0:00</span>
      <div class="progress-track" id="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
        <div class="progress-thumb" id="progress-thumb"></div>
      </div>
      <span class="progress-time" id="progress-dur">0:00</span>
    </div>
    <div class="player-controls">
      <button class="player-btn" id="btn-prev" aria-label="上一条">⏮</button>
      <button class="player-btn main" id="btn-play" aria-label="播放暂停">▶</button>
      <button class="player-btn" id="btn-next" aria-label="下一条">⏭</button>
      <button class="player-btn speed-toggle" id="speed-toggle" aria-label="切换倍速">1.0x</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <audio id="audio" preload="auto"></audio>

  <script>
    const API = '';
    let rawTweets = [];       // 服务端返回的原始数据
    let tweets = [];          // 经过筛选+排序后的当前展示
    let subscriptions = [];   // 订阅的博主列表
    let queue = [];
    let currentIndex = -1;
    let showAll = false;

    // 已听状态：localStorage 持久化到浏览器（服务端不再存）
    const LISTENED_KEY = 'xreader.listened.v1';
    function loadListened() {
      try {
        const raw = localStorage.getItem(LISTENED_KEY);
        return new Set(raw ? JSON.parse(raw) : []);
      } catch (e) { return new Set(); }
    }
    function saveListened(set) {
      try {
        // 保留最近 2000 条，避免无限膨胀
        const arr = [...set].slice(-2000);
        localStorage.setItem(LISTENED_KEY, JSON.stringify(arr));
      } catch (e) {}
    }
    let listenedSet = loadListened();
    function markListened(id) {
      listenedSet.add(id);
      saveListened(listenedSet);
    }
    function isListened(id) {
      return listenedSet.has(id);
    }

    // 筛选/排序状态（localStorage 记忆）
    let activeUser = localStorage.getItem('xreader.filter') || 'ALL';  // 'ALL' 或某个 username
    let order = localStorage.getItem('xreader.order') || 'newest';     // 'newest' | 'oldest' | 'random'

    // 从 localStorage 读取上次的倍速
    let playbackRate = parseFloat(localStorage.getItem('xreader.rate') || '1.0');
    if (isNaN(playbackRate) || playbackRate < 0.5 || playbackRate > 3.0) playbackRate = 1.0;

    const $ = (id) => document.getElementById(id);
    const audio = $('audio');

    function toast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function fmtTime(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      const now = Date.now();
      const diff = now - ts;
      if (diff < 60000) return '刚刚';
      if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
      if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
      return d.toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    // Fisher-Yates 洗牌
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function applyFilterAndSort() {
      let list = rawTweets;
      // 已听过滤（服务端已不再过滤，客户端根据 localStorage 判断）
      if (!showAll) {
        list = list.filter(t => !isListened(t.id));
      }
      if (activeUser !== 'ALL') {
        list = list.filter(t => t.username === activeUser);
      }
      if (order === 'newest') {
        list = list.slice().sort((a, b) => (b.pub_date || 0) - (a.pub_date || 0));
      } else if (order === 'oldest') {
        list = list.slice().sort((a, b) => (a.pub_date || 0) - (b.pub_date || 0));
      } else if (order === 'random') {
        list = shuffle(list);
      }
      tweets = list;
    }

    function orderLabel() {
      return order === 'newest' ? '🕒 最新在前'
           : order === 'oldest' ? '🕒 最早在前'
           : '🔀 随机顺序';
    }

    function renderFilterBar() {
      const bar = $('filter-bar');
      // 计算每个博主的"未听/总数"
      const totalPerUser = {};
      const unheardPerUser = {};
      rawTweets.forEach(t => {
        totalPerUser[t.username] = (totalPerUser[t.username] || 0) + 1;
        if (!isListened(t.id)) unheardPerUser[t.username] = (unheardPerUser[t.username] || 0) + 1;
      });
      const totalUnheard = rawTweets.filter(t => !isListened(t.id)).length;
      const chips = [
        `<div class="chip ${activeUser === 'ALL' ? 'active' : ''}" data-user="ALL">全部 · ${showAll ? rawTweets.length : totalUnheard}</div>`,
        ...subscriptions.map(u => {
          const num = showAll ? (totalPerUser[u] || 0) : (unheardPerUser[u] || 0);
          return `<div class="chip ${activeUser === u ? 'active' : ''}" data-user="${u}">@${u} · ${num}</div>`;
        }),
      ];
      bar.innerHTML = chips.join('');
    }

    async function loadFeed() {
      try {
        const r = await fetch(API + '/api/feed');
        const data = await r.json();
        rawTweets = data.tweets || [];
        subscriptions = data.subscriptions || [];
        applyFilterAndSort();
        $('count-badge').textContent = `${tweets.length} 条${showAll ? '' : ' 未听'}${activeUser !== 'ALL' ? ' · @' + activeUser : ''}`;
        $('sub-badge').textContent = `订阅 ${subscriptions.length} 人`;
        renderFilterBar();
        renderList();
      } catch (e) {
        toast('加载失败: ' + e.message);
      }
    }

    function renderList() {
      const listEl = $('list');
      if (!tweets.length) {
        listEl.innerHTML = `<div class="empty"><div class="empty-emoji">🎉</div><div>暂无${showAll ? '' : '未听'}推文<br /><small style="color:#475569">系统每 60 分钟自动抓取一次</small></div></div>`;
        return;
      }
      listEl.innerHTML = tweets.map((t, i) => `
        <div class="tweet ${isListened(t.id) ? 'listened' : ''}" data-id="${t.id}" data-idx="${i}">
          <div class="tweet-head">
            <span class="author">@${t.username}</span>
            <span class="time">${fmtTime(t.pub_date)}</span>
          </div>
          <div class="content">${escapeHtml(t.content)}</div>
          <div class="tweet-actions">
            <button class="play-btn" data-action="play" data-idx="${i}">▶ 播放</button>
            <button data-action="mark" data-id="${t.id}">✓ 标已听</button>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // 事件委托
    document.addEventListener('click', async (e) => {
      const t = e.target.closest('button');
      if (!t) return;
      const action = t.dataset.action;
      const idx = t.dataset.idx;
      const id = t.dataset.id;

      if (action === 'play') {
        queue = tweets.slice(parseInt(idx, 10));
        currentIndex = 0;
        playCurrent();
      } else if (action === 'mark') {
        markListened(id);
        applyFilterAndSort();
        renderList();
        $('count-badge').textContent = `${tweets.length} 条${showAll ? '' : ' 未听'}${activeUser !== 'ALL' ? ' · @' + activeUser : ''}`;
      }
    });

    $('play-all').onclick = () => {
      if (!tweets.length) { toast('队列为空'); return; }
      queue = [...tweets];
      currentIndex = 0;
      playCurrent();
    };
    $('refresh').onclick = () => {
      toast('刷新中…');
      loadFeed();
    };
    $('toggle-all').onclick = () => {
      showAll = !showAll;
      $('toggle-all').textContent = showAll ? '只看未听' : '显示全部';
      applyFilterAndSort();
      $('count-badge').textContent = `${tweets.length} 条${showAll ? '' : ' 未听'}${activeUser !== 'ALL' ? ' · @' + activeUser : ''}`;
      renderList();
    };
    // 播放顺序切换：newest → oldest → random → newest ...
    $('toggle-order').onclick = () => {
      order = order === 'newest' ? 'oldest' : order === 'oldest' ? 'random' : 'newest';
      localStorage.setItem('xreader.order', order);
      $('toggle-order').textContent = orderLabel();
      applyFilterAndSort();
      renderList();
      toast(order === 'random' ? '🔀 已切换到随机顺序' : order === 'oldest' ? '最早在前' : '最新在前');
    };
    $('toggle-order').textContent = orderLabel();

    // 博主 chips 点击
    $('filter-bar').addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      activeUser = chip.dataset.user;
      localStorage.setItem('xreader.filter', activeUser);
      applyFilterAndSort();
      $('count-badge').textContent = `${tweets.length} 条${showAll ? '' : ' 未听'}${activeUser !== 'ALL' ? ' · @' + activeUser : ''}`;
      renderFilterBar();
      renderList();
    });

    // 倍速切换按钮（点击循环切换档位）
    // 六档：0.5 → 1.0 → 1.5 → 2.0 → 2.5 → 3.0 → 0.5 ...
    const SPEED_STEPS = [0.5, 1.0, 1.5, 2.0, 2.5, 3.0];
    function nextSpeed(cur) {
      let idx = SPEED_STEPS.findIndex(s => Math.abs(s - cur) < 0.01);
      if (idx === -1) idx = 1; // 找不到当前值，默认从 1.0 开始
      return SPEED_STEPS[(idx + 1) % SPEED_STEPS.length];
    }
    function updateSpeedButton() {
      const btn = $('speed-toggle');
      if (btn) btn.textContent = playbackRate.toFixed(1) + 'x';
    }
    function applySpeedToAudio() {
      try {
        audio.playbackRate = playbackRate;
        audio.preservesPitch = true;
        audio.mozPreservesPitch = true;
        audio.webkitPreservesPitch = true;
      } catch (e) {}
    }
    $('speed-toggle').addEventListener('click', () => {
      playbackRate = nextSpeed(playbackRate);
      localStorage.setItem('xreader.rate', String(playbackRate));
      updateSpeedButton();
      applySpeedToAudio();
      toast(`倍速 ${playbackRate.toFixed(1)}x`);
    });
    updateSpeedButton();

    // 进度条
    const progressFill = $('progress-fill');
    const progressThumb = $('progress-thumb');
    const progressCur = $('progress-cur');
    const progressDur = $('progress-dur');
    const progressTrack = $('progress-track');
    function fmtSec(s) {
      if (!isFinite(s) || s < 0) return '0:00';
      const m = Math.floor(s / 60);
      const ss = Math.floor(s % 60).toString().padStart(2, '0');
      return `${m}:${ss}`;
    }
    function updateProgress() {
      const cur = audio.currentTime || 0;
      const dur = audio.duration || 0;
      const pct = dur > 0 ? (cur / dur) * 100 : 0;
      progressFill.style.width = pct + '%';
      progressThumb.style.left = pct + '%';
      progressCur.textContent = fmtSec(cur);
      progressDur.textContent = fmtSec(dur);
    }
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('loadedmetadata', updateProgress);
    audio.addEventListener('durationchange', updateProgress);
    // 拖动进度条跳转
    function seekFromEvent(e) {
      const rect = progressTrack.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      if (audio.duration && isFinite(audio.duration)) {
        audio.currentTime = audio.duration * ratio;
      }
    }
    progressTrack.addEventListener('click', seekFromEvent);
    progressTrack.addEventListener('touchstart', (e) => { e.preventDefault(); seekFromEvent(e); }, { passive: false });

    // ---- 播放器：预取下一条 + 单 Audio 实例复用（解决 iOS 锁屏连播问题）----
    // 预取缓存：Map<tweetId, Promise<blobUrl>>
    const audioCache = new Map();
    function prefetchTTS(tweet) {
      if (!tweet) return null;
      if (audioCache.has(tweet.id)) return audioCache.get(tweet.id);
      const p = fetch(API + '/api/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: tweet.content }),
      }).then(async r => {
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          throw new Error(err.error || `TTS ${r.status}`);
        }
        const blob = await r.blob();
        return URL.createObjectURL(blob);
      }).catch(e => {
        audioCache.delete(tweet.id); // 失败的清缓存，允许重试
        throw e;
      });
      audioCache.set(tweet.id, p);
      // 简单清理：最多缓存 5 条，超了删最老的
      if (audioCache.size > 5) {
        const firstKey = audioCache.keys().next().value;
        const oldUrl = audioCache.get(firstKey);
        audioCache.delete(firstKey);
        // 释放 blob URL
        Promise.resolve(oldUrl).then(u => { try { URL.revokeObjectURL(u); } catch (e) {} }).catch(() => {});
      }
      return p;
    }

    let isLoading = false;
    function setLoadingUI(loading) {
      isLoading = loading;
      const info = $('player-info');
      if (loading) {
        info.innerHTML = '<span class="loading-dot"></span>正在生成语音…';
      }
    }

    async function playCurrent() {
      if (currentIndex < 0 || currentIndex >= queue.length) {
        stopPlayer();
        return;
      }
      const t = queue[currentIndex];
      $('player').classList.add('active');
      $('player-content').textContent = t.content;
      $('btn-play').textContent = '⏸';

      // 高亮当前播放的卡片
      document.querySelectorAll('.tweet').forEach(el => {
        el.classList.toggle('playing', el.dataset.id === t.id);
      });

      // 更新 iOS 锁屏信息
      if ('mediaSession' in navigator) {
        try {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: t.content.slice(0, 80),
            artist: '@' + t.username,
            album: 'X Reader',
          });
          navigator.mediaSession.playbackState = 'playing';
        } catch (e) {}
      }

      // 显示 loading
      setLoadingUI(true);

      try {
        // 拿到（缓存或新请求）的 blob URL
        const url = await prefetchTTS(t);
        setLoadingUI(false);
        $('player-info').textContent = `@${t.username} · ${currentIndex + 1}/${queue.length}`;

        audio.src = url;
        applySpeedToAudio();
        await audio.play();
        applySpeedToAudio(); // Safari 需要 play 后再设一次

        // 关键：立即预取下一条（覆盖 iOS 锁屏后无法发起新请求的限制）
        const next = queue[currentIndex + 1];
        if (next) prefetchTTS(next).catch(() => {});
      } catch (e) {
        setLoadingUI(false);
        console.error('[playCurrent] 失败:', e);
        toast('播放失败: ' + e.message + '（3s 后跳下一条）');
        setTimeout(() => nextTrack(), 3000);
      }
    }

    function stopPlayer() {
      audio.pause();
      $('player').classList.remove('active');
      $('btn-play').textContent = '▶';
      document.querySelectorAll('.tweet.playing').forEach(el => el.classList.remove('playing'));
      currentIndex = -1;
      if ('mediaSession' in navigator) {
        try { navigator.mediaSession.playbackState = 'none'; } catch (e) {}
      }
    }

    async function nextTrack() {
      if (currentIndex >= 0 && queue[currentIndex]) {
        markListened(queue[currentIndex].id);
      }
      currentIndex++;
      if (currentIndex >= queue.length) {
        toast('播放完毕');
        stopPlayer();
        loadFeed();
        return;
      }
      playCurrent();
    }

    function prevTrack() {
      if (currentIndex > 0) {
        currentIndex--;
        playCurrent();
      }
    }

    audio.addEventListener('ended', nextTrack);
    audio.addEventListener('play', applySpeedToAudio);
    audio.addEventListener('loadedmetadata', applySpeedToAudio);

    $('btn-play').onclick = () => {
      if (audio.paused) {
        if (!audio.src) { toast('还没开始播放，请选一条推文'); return; }
        audio.play(); $('btn-play').textContent = '⏸';
      } else {
        audio.pause(); $('btn-play').textContent = '▶';
      }
    };
    $('btn-next').onclick = nextTrack;
    $('btn-prev').onclick = prevTrack;

    // iOS 锁屏媒体控制
    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', () => audio.play());
      navigator.mediaSession.setActionHandler('pause', () => audio.pause());
      navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
      navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
    }

    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    loadFeed();
    setInterval(loadFeed, 5 * 60 * 1000);
  </script>
</body>
</html>
